<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
   <div class="container my-5 text-center">
    <h1 class="text-primary">Random User </h1>
    
       <input type="number" id="count" placeholder="number of user">
        <button onclick="getUser()" class="btn btn-success">Get Random User</button>

        <div id="result" class="row mt-4">

        </div>


    </div>

    
</body>
<script>

   async function getUser() {
        try {
            const count = document.getElementById("count").value
            const response = await fetch(" https://randomuser.me/api/")
            console.log(response);

            const RandomData = await response.json()
            console.log(RandomData);
            
            result.innerHTML= ""
            RandomData.results.forEach(user=>{
            result.innerHTML += `

             <div class="col-lg-3 d-flex">
              <div class="card mb-2 p-3" style="width: 18rem;">
                <img height="300px" src="${user.picture.large}" class="card-img-top" alt="...">
             <div class="card-body">
             <h5 class="card-title text-center">${user.name}</h5>
             <p class="card-text text-center">${user.email}</p>
              <p >${user.location.city},${user.location.country}</p>
              <p class="card-text text-center">${user.phone}</p>
             </div>
             </div>
           </div>
            `
        })

            
        } catch (error) {
            console.log(error);
            
            
        }
        
    }
    getUser()


</script>
</html>
